<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>little film — for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Haar cheez padhni nhi hoti file khol ke */
  :root{
    --cream: #f6efe4;
    --cream-2: #efe3d1;
    --rose: #d1436b;
    --rose-deep: #a5254a;
    --pink: #e85f88;
    --ink: #3a2a2a;
    --gold: #c99a4a;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background:#0c0a0a;
    overflow:hidden;
    font-family:'Playfair Display', serif;
  }

  #stage{
    position:relative;
    width:100%; height:100vh;
    max-width:900px; margin:0 auto;
    background: radial-gradient(ellipse at 50% 30%, var(--cream-2), var(--cream) 70%);
    overflow:hidden;
  }

  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 900ms ease;
  }
  .scene.active{ opacity:1; pointer-events:auto; }

  .eyebrow{
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: #8a6a56;
    opacity:0;
    transform: translateY(6px);
    transition: opacity 700ms ease, transform 700ms ease;
  }
  .scene.active .eyebrow{ opacity:1; transform:translateY(0); transition-delay: 200ms; }

  .hint{
    position:absolute; bottom:44px;
    font-size:12px; letter-spacing:0.12em; color:#a98a72;
    opacity:0.85;
  }

  /* ---------- Scene 1 : bow ---------- */
  #scene-bow .eyebrow{ position:absolute; top:14%; }

  .heart-wrap{
    position:absolute; top:22%;
    width:120px; height:110px;
    display:flex; align-items:center; justify-content:center;
  }
  .heart-glow{
    position:absolute; inset:-60px;
    background: radial-gradient(circle, rgba(216,80,120,0.45), rgba(216,80,120,0) 70%);
    filter: blur(6px);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.85; }
    50%{ transform:scale(1.12); opacity:1; }
  }
  .heart{
    position:relative; width:64px; height:58px;
    transform: rotate(0deg) scale(1);
    transition: transform 240ms ease;
  }
  .heart::before, .heart::after{
    content:""; position:absolute; top:0; width:34px; height:54px;
    background: linear-gradient(135deg,#ef7a9a,var(--rose-deep));
    border-radius: 34px 34px 0 0;
  }
  .heart::before{ left:32px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .heart::after{ left:0; transform: rotate(45deg); transform-origin: 100% 100%; }
  .heart-sheen{
    position:absolute; left:14px; top:8px; width:12px; height:12px;
    border-radius:50%; background:rgba(255,255,255,0.65); filter: blur(1px);
  }
  .heart-wrap.hit .heart{ animation: pop 520ms ease forwards; }
  @keyframes pop{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.35); }
    70%{ transform: scale(0.4); opacity: 1;}
    100%{ transform: scale(0.1); opacity:0; }
  }

  #bowSvg{ width: 300px; height: 300px; touch-action:none; user-select:none; }
  .bow-shape{ fill:none; stroke:#4a2f22; stroke-width:6; stroke-linecap:round; }
  .bow-string{ stroke:#c9bda9; stroke-width:2; fill:none; }
  .arrow-shaft{ stroke:#4a2f22; stroke-width:3; }
  .arrow-head{ fill:#c0435f; }
  .arrow-fletch{ stroke:#c0435f; stroke-width:3; }
  #nock{ cursor: grab; }
  #nock:active{ cursor: grabbing; }

  /* ---------- Full-screen flash transition ---------- */
  #flash{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 35%, #e94b78, #b7204a 80%);
    opacity:0; pointer-events:none; z-index:20;
  }

  /* ---------- Scene 2 : wish ---------- */
  #scene-wish{
    background: radial-gradient(circle at 50% 30%, #e2537c, #b52350 85%);
  }
  #scene-wish .eyebrow{ color: rgba(255,255,255,0.85); position:absolute; top:20%; }
  .wish-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size: clamp(46px, 9vw, 84px);
    color:#fbf3e9;
    text-align:center;
    line-height:1.02;
    margin:0;
    opacity:0; transform: translateY(14px);
    transition: opacity 900ms ease, transform 900ms ease;
  }
  .scene.active .wish-title{ opacity:1; transform:translateY(0); transition-delay: 450ms; }
  .underline{ width:180px; height:26px; margin:18px 0 10px; opacity:0; transition: opacity 700ms ease; }
  .scene.active .underline{ opacity:1; transition-delay: 1000ms; }
  .underline path{ fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round; }
  #scene-wish .sub{
    position:absolute; bottom:20%;
    color: rgba(255,255,255,0.88); font-style:italic; font-size:15px; letter-spacing:0.03em;
  }

  /* ---------- Scene 3 : tree ---------- */
  #scene-tree{ flex-direction:row; justify-content:center; align-items:center; gap:4vw; padding: 0 24px; }
  .tree-copy{
    max-width: 300px;
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  }
  @media (max-width: 720px){
    #scene-tree{ flex-direction:column; gap:8px; padding-top: 6%; }
    .tree-copy{ align-items:center; text-align:center; order:2; }
    #treeSvg{ order:1; width: 240px; height: 300px; }
    .replay{ position:static; margin-top:14px; }
  }
  .tree-copy .eyebrow{ position:static; }
  .tree-headline{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size: clamp(40px, 6vw, 60px);
    color: var(--rose-deep);
    margin:0;
  }
  .tree-copy .grow-note{
    font-size:14px; color:#7d6a5a; font-style:italic;
    opacity:0; transform:translateY(8px);
    transition: opacity 800ms ease, transform 800ms ease;
  }
  #scene-tree.bloomed .grow-note{ opacity:1; transform:translateY(0); }

  #treeSvg{ width: 300px; height: 380px; overflow:visible; }
  #trunk{
    fill:none; stroke:#4a2f22; stroke-width:10; stroke-linecap:round;
    stroke-dasharray: 260; stroke-dashoffset: 260;
  }
  #scene-tree.active #trunk{ animation: draw 1.1s ease forwards; }
  .branch{
    fill:none; stroke:#4a2f22; stroke-width:5; stroke-linecap:round;
    stroke-dasharray: 140; stroke-dashoffset: 140;
  }
  #scene-tree.active .branch{ animation: draw 1s ease forwards; animation-delay: 0.9s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .blossom{ opacity:0; transform-box: fill-box; transform-origin:center; transform:scale(0); }
  #scene-tree.bloomed .blossom{ animation: bloom 560ms cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bloom{ to{ opacity:1; transform:scale(1); } }

  #petals{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:5; }
  .petal{
    position:absolute; top:-20px; border-radius: 0 60% 0 60%;
    background: linear-gradient(135deg,#f2a4b8,#e2557f);
    animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes fall{
    from{ transform: translateY(-40px) rotate(0deg); opacity:0.9; }
    to{ transform: translateY(115vh) rotate(320deg); opacity:0.2; }
  }

  .replay{
    position:absolute; bottom:8%;
    font-family:'Playfair Display', serif; font-style:italic; font-size:14px;
    letter-spacing:0.04em; color:#8a6a56;
    background:none; border:1px solid #c9a98f; border-radius:999px;
    padding:10px 26px; cursor:pointer;
    opacity:0; transition: opacity 700ms ease, background 200ms ease, color 200ms ease;
  }
  #scene-tree.bloomed .replay{ opacity:1; transition-delay: 1.6s; }
  .replay:hover{ background:#c9a98f; color:#fff; }
  .replay:focus-visible{ outline: 2px solid var(--rose-deep); outline-offset:2px; }

</style>
</head>
<body>

<div id="stage">

  <!-- Scene 1: bow & arrow -->
  <section id="scene-bow" class="scene active">
    <p class="eyebrow">a little something, for you</p>

    <div class="heart-wrap" id="heartWrap">
      <div class="heart-glow"></div>
      <div class="heart"><span class="heart-sheen"></span></div>
    </div>

    <svg id="bowSvg" viewBox="0 0 300 300">
      <path class="bow-shape" d="M 90,240 Q 150,60 210,240" />
      <path class="bow-string" id="stringA" d="" />
      <path class="bow-string" id="stringB" d="" />
      <g id="arrowGroup">
        <line class="arrow-shaft" id="shaft" x1="0" y1="0" x2="0" y2="0" />
        <line class="arrow-fletch" x1="0" y1="0" x2="0" y2="0" id="f1"/>
        <line class="arrow-fletch" x1="0" y1="0" x2="0" y2="0" id="f2"/>
        <polygon class="arrow-head" id="arrowHead" points="0,0 0,0 0,0" />
      </g>
      <circle id="nock" cx="150" cy="240" r="16" fill="transparent" />
    </svg>

    <p class="hint">pull &amp; release</p>
  </section>

  <!-- Flash transition -->
  <div id="flash"></div>

  <!-- Scene 2: the wish -->
  <section id="scene-wish" class="scene">
    <p class="eyebrow">make a wish&hellip;</p>
    <h1 class="wish-title">Happy<br>Birthday<br>Pratham</h1>
    <svg class="underline" viewBox="0 0 180 26"><path d="M4,18 Q90,2 176,14"/></svg>
    <p class="sub">to someone worth celebrating</p>
  </section>

  <!-- Scene 3: the tree -->
  <section id="scene-tree" class="scene">
    <div class="tree-copy">
      <p class="eyebrow">&hellip;make it count</p>
      <h2 class="tree-headline">Happy Birthday, Pratham!</h2>
      <p class="grow-note">here's to a year that blooms</p>
      <button class="replay" id="replayBtn">play it again</button>
    </div>

    <svg id="treeSvg" viewBox="0 0 300 380">
      <path id="trunk" d="M150,370 C150,300 145,260 148,210" />
      <path class="branch" d="M148,240 C120,220 100,190 92,150" />
      <path class="branch" d="M148,230 C176,208 196,180 202,145" />
      <path class="branch" d="M148,215 C150,190 150,165 148,140" />
      <g id="blossoms"></g>
    </svg>
  </section>

  <div id="petals"></div>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var sceneBow = document.getElementById('scene-bow');
  var sceneWish = document.getElementById('scene-wish');
  var sceneTree = document.getElementById('scene-tree');
  var flash = document.getElementById('flash');
  var heartWrap = document.getElementById('heartWrap');
  var replayBtn = document.getElementById('replayBtn');

  // ---------- Bow & arrow ----------
  var svg = document.getElementById('bowSvg');
  var nock = document.getElementById('nock');
  var stringA = document.getElementById('stringA');
  var stringB = document.getElementById('stringB');
  var arrowGroup = document.getElementById('arrowGroup');
  var shaft = document.getElementById('shaft');
  var f1 = document.getElementById('f1');
  var f2 = document.getElementById('f2');
  var arrowHead = document.getElementById('arrowHead');

  var TIP_A = {x:90, y:240};
  var TIP_B = {x:210, y:240};
  var REST_Y = 240;
  var MAX_PULL = 90;
  var ARROW_LEN = 150;
  var dragging = false;
  var pullY = REST_Y;
  var shot = false;

  function drawArrow(py){
    var headY = py - ARROW_LEN;
    // string
    stringA.setAttribute('d', 'M'+TIP_A.x+','+TIP_A.y+' L150,'+py);
    stringB.setAttribute('d', 'M'+TIP_B.x+','+TIP_B.y+' L150,'+py);
    // shaft
    shaft.setAttribute('x1', 150); shaft.setAttribute('y1', py);
    shaft.setAttribute('x2', 150); shaft.setAttribute('y2', headY + 14);
    // fletching near nock end
    f1.setAttribute('x1', 150); f1.setAttribute('y1', py);
    f1.setAttribute('x2', 144); f1.setAttribute('y2', py + 10);
    f2.setAttribute('x1', 150); f2.setAttribute('y1', py);
    f2.setAttribute('x2', 156); f2.setAttribute('y2', py + 10);
    // arrowhead triangle
    arrowHead.setAttribute('points', '150,'+headY+' 142,'+(headY+18)+' 158,'+(headY+18));
    nock.setAttribute('cy', py);
  }
  drawArrow(pullY);

  function clientToSvgY(clientY){
    var rect = svg.getBoundingClientRect();
    var scaleY = 300 / rect.height;
    return (clientY - rect.top) * scaleY;
  }

  function pointerDown(e){
    if (shot) return;
    dragging = true;
    var song = document.getElementById('bgSong');
    if (song && !song._primed){
      song._primed = true;
      
      var p = song.play();
      if (p && p.then){
        p.then(function(){ song.pause(); song.currentTime = 0; }).catch(function(){});
      }
    }
    nock.setPointerCapture && e.pointerId != null && nock.setPointerCapture(e.pointerId);
  }
  function pointerMove(e){
    if (!dragging) return;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var y = clientToSvgY(clientY);
    pullY = Math.max(REST_Y, Math.min(REST_Y + MAX_PULL, y));
    drawArrow(pullY);
  }
  function pointerUp(){
    if (!dragging) return;
    dragging = false;
    var pulled = pullY - REST_Y;
    if (pulled > 32){
      release(pulled / MAX_PULL);
    } else {
      springBack();
    }
  }
  function springBack(){
    var start = pullY, t0 = performance.now(), dur = 260;
    function step(t){
      var p = Math.min(1, (t - t0)/dur);
      var ease = 1 - Math.pow(1-p, 3);
      pullY = start + (REST_Y - start) * ease;
      drawArrow(pullY);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function release(power){
    shot = true;
    var song = document.getElementById('bgSong');
    if (song){
      song.currentTime = 0;
      song.play().catch(function(){ /* browser blocked autoplay, ignore */ });
    }
    var start = pullY;
    var target = -200; // fly off top of svg
    var t0 = performance.now();
    var dur = 260 - power*60;
    function step(t){
      var p = Math.min(1, (t - t0)/dur);
      var ease = p*p;
      pullY = start + (target - start) * ease;
      drawArrow(pullY);
      if (p < 1) {
        requestAnimationFrame(step);
      } else {
        hitHeart();
      }
    }
    requestAnimationFrame(step);
  }

  nock.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  nock.addEventListener('touchstart', pointerDown, {passive:true});
  window.addEventListener('touchmove', pointerMove, {passive:true});
  window.addEventListener('touchend', pointerUp);

  function hitHeart(){
    heartWrap.classList.add('hit');
    arrowGroup.style.transition = 'opacity 150ms ease';
    arrowGroup.style.opacity = '0';
    setTimeout(function(){
      flashAndAdvance();
    }, 280);
  }

  function flashAndAdvance(){
    flash.style.transition = 'opacity 380ms ease';
    flash.style.opacity = '1';
    setTimeout(function(){
      sceneBow.classList.remove('active');
      sceneWish.classList.add('active');
      setTimeout(function(){
        flash.style.opacity = '0';
      }, 120);
      setTimeout(function(){
        sceneWish.classList.remove('active');
        sceneTree.classList.add('active');
        growTree();
      }, 3600);
    }, 400);
  }

  // Tree bloom 
  var blossomsGroup = document.getElementById('blossoms');
  var bloomed = false;

  function heartPoint(t, scale, cx, cy){
  
    var x = 16*Math.pow(Math.sin(t),3);
    var y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x: cx + x*scale, y: cy - y*scale };
  }

  function heartLeafPath(r){
    
    var scale = r/16;
    var steps = 20;
    var d = '';
    for (var i=0;i<=steps;i++){
      var t = (i/steps) * Math.PI*2;
      var x = 16*Math.pow(Math.sin(t),3);
      var y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      var px = (x*scale).toFixed(2);
      var py = (-y*scale).toFixed(2);
      d += (i===0 ? 'M' : 'L') + px + ',' + py + ' ';
    }
    return d + 'Z';
  }

  function buildBlossoms(){
    if (blossomsGroup.childElementCount) return;
    var colors = ['#e8517d','#f2789c','#f0a13e','#f6c15a','#eb6d8f'];
    var count = 70;
    var cx = 148, cy = 128, scale = 6.6;
    for (var i=0;i<count;i++){
      var t = Math.random()*Math.PI*2;
      var jitter = 0.55 + Math.random()*0.55; // pull points inward for a fuller canopy
      var p = heartPoint(t, scale*jitter, cx, cy);
      var r = 6 + Math.random()*7;
      var c = colors[Math.floor(Math.random()*colors.length)];
      var rot = (Math.random()*50 - 25).toFixed(1);
      var g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('transform', 'translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+') rotate('+rot+')');
      var el = document.createElementNS('http://www.w3.org/2000/svg','path');
      el.setAttribute('d', heartLeafPath(r));
      el.setAttribute('fill', c);
      el.setAttribute('class','blossom');
      el.style.animationDelay = (Math.random()*0.9).toFixed(2)+'s';
      g.appendChild(el);
      blossomsGroup.appendChild(g);
    }
  }

  function growTree(){
    buildBlossoms();
    setTimeout(function(){
      sceneTree.classList.add('bloomed');
      bloomed = true;
      startPetals();
    }, 1900);
  }

  //Falling petals ----------
  var petalLayer = document.getElementById('petals');
  var petalInterval = null;
  function startPetals(){
    if (petalInterval) return;
    petalInterval = setInterval(function(){
      if (!sceneTree.classList.contains('bloomed')) return;
      var p = document.createElement('div');
      p.className = 'petal';
      var size = 6 + Math.random()*7;
      p.style.width = size+'px';
      p.style.height = (size*0.85)+'px';
      p.style.left = (Math.random()*100)+'%';
      p.style.animationDuration = (5 + Math.random()*4)+'s';
      p.style.opacity = (0.6 + Math.random()*0.4).toFixed(2);
      petalLayer.appendChild(p);
      setTimeout(function(){ p.remove(); }, 10000);
    }, 260);
  }
  function stopPetals(){
    clearInterval(petalInterval);
    petalInterval = null;
    petalLayer.innerHTML = '';
  }

  // Replay ----------
  replayBtn.addEventListener('click', function(){
    var song = document.getElementById('bgSong');
    if (song){ song.pause(); song.currentTime = 0; }
    stopPetals();
    sceneTree.classList.remove('active','bloomed');
    blossomsGroup.innerHTML = '';
    sceneWish.classList.remove('active');
    sceneBow.classList.add('active');
    heartWrap.classList.remove('hit');
    arrowGroup.style.opacity = '1';
    shot = false;
    pullY = REST_Y;
    drawArrow(pullY);
    flash.style.transition = 'none';
    flash.style.opacity = '0';
  });
})();


</script>
</body>
</html>
